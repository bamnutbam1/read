<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>อ่านออเดอร์ครัว - Text to Speech</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #4ade80; /* Green */
            --primary-dark: #22c55e;
            --danger: #f87171;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* กล่องข้อความ */
        .text-box {
            width: 100%;
            flex: 1;
            min-height: 250px;
            background-color: var(--surface);
            color: var(--text);
            border: 2px solid #333;
            border-radius: 16px;
            padding: 20px;
            font-family: 'Prompt', sans-serif;
            font-size: 22px;
            line-height: 1.6;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        .text-box:focus {
            border-color: var(--primary);
        }

        .text-box::placeholder {
            color: #555;
            text-align: center;
            padding-top: 20%;
        }

        /* แถบเครื่องมือ */
        .toolbar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-family: 'Prompt', sans-serif;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s, filter 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-paste {
            background-color: #374151;
            color: white;
        }
        
        .btn-clear {
            background-color: rgba(248, 113, 113, 0.2);
            color: var(--danger);
            border: 1px solid rgba(248, 113, 113, 0.4);
        }

        /* ปุ่มเล่นเสียงยักษ์ */
        .play-container {
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .btn-play {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: #000;
            font-size: 32px;
            font-weight: 700;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(74, 222, 128, 0.3);
        }

        .btn-play.playing {
            background: linear-gradient(135deg, #ef4444, #f87171);
            color: white;
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.3);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* การตั้งค่า */
        .settings {
            background-color: var(--surface);
            padding: 15px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .settings label {
            font-size: 18px;
            white-space: nowrap;
        }

        input[type="range"] {
            flex: 1;
            accent-color: var(--primary);
            height: 8px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🗣️ อ่านออเดอร์ครัว</h1>
        </div>

        <textarea id="orderText" class="text-box" placeholder="วางออเดอร์ที่คัดลอกมาลงที่นี่..."></textarea>

        <div class="toolbar">
            <button class="btn btn-paste" onclick="pasteFromClipboard()">
                📋 วางข้อความ
            </button>
            <button class="btn btn-clear" onclick="clearText()">
                🗑️ ล้าง
            </button>
        </div>

        <div class="settings">
            <label for="speedRate">🏃 ความเร็ว:</label>
            <input type="range" id="speedRate" min="0.5" max="1.5" step="0.1" value="0.9">
            <span id="speedValue">0.9x</span>
        </div>

        <div class="play-container">
            <button id="playBtn" class="btn btn-play" onclick="toggleSpeech()">
                ▶️ อ่านออกเสียง
            </button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const textInput = document.getElementById('orderText');
        const playBtn = document.getElementById('playBtn');
        const speedRate = document.getElementById('speedRate');
        const speedValue = document.getElementById('speedValue');
        
        let synth = window.speechSynthesis;
        let isSpeaking = false;

        // อัพเดทตัวเลขความเร็ว
        speedRate.addEventListener('input', function() {
            speedValue.textContent = this.value + 'x';
        });

        // ฟังก์ชันล้างข้อความ
        function clearText() {
            textInput.value = '';
            stopSpeech();
            textInput.focus();
        }

        // ฟังก์ชันดึงข้อความจาก Clipboard (ใช้ได้ดีในมือถือและ https)
        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    textInput.value = text;
                    showToast('✅ วางข้อความแล้ว');
                } else {
                    showToast('⚠️ ไม่มีข้อความในคลิปบอร์ด');
                }
            } catch (err) {
                // กรณีเบราว์เซอร์ไม่อนุญาต หรือเป็น http ธรรมดา
                showToast('แตะค้างที่กล่องข้อความแล้วเลือก "วาง" (Paste)');
            }
        }

        // ----------------------------------------------------
        // ฟังก์ชันสำคัญ: ทำความสะอาดข้อความให้อ่านง่ายขึ้น
        // ----------------------------------------------------
        function cleanTextForSpeech(rawText) {
            let lines = rawText.split('\n');
            let speechParts = [];

            for (let line of lines) {
                line = line.trim();
                
                // ข้ามบรรทัดที่ไม่จำเป็นต้องอ่าน (หัวบิล, ขีดคั่น, ฯลฯ)
                if (!line || 
                    line.startsWith('🍳') || 
                    line.startsWith('👤') || 
                    line.startsWith('🕐') || 
                    line.startsWith('─') || 
                    line.startsWith('💰')) {
                    continue;
                }

                // แปลงรูปแบบ "1. กะเพราหมูกรอบ × 2" -> "รายการที่ 1 กะเพราหมูกรอบ 2 ที่"
                line = line.replace(/^(\d+)\.\s*/, 'รายการที่ $1, ');
                line = line.replace(/[×xX]\s*(\d+)/, '$1 ที่');
                
                // แปลงหมายเหตุ
                line = line.replace('📝', 'หมายเหตุ');
                
                // ลบวงเล็บออกเพื่อให้อ่านลื่นขึ้น
                line = line.replace(/\(/g, ' ').replace(/\)/g, ' ');

                speechParts.push(line);
            }

            // ถ้าระบบตัดจนไม่เหลืออะไรเลย (เช่น พิมพ์มาเองไม่ได้ก๊อปจากแอป) ให้ใช้อ่านดิบๆ
            if (speechParts.length === 0 && rawText.trim() !== '') {
                return rawText;
            }

            // เชื่อมประโยคพร้อมเว้นวรรค
            return speechParts.join('. '); 
        }

        // ควบคุมการอ่าน
        function toggleSpeech() {
            if (synth.speaking) {
                stopSpeech();
                return;
            }

            const rawText = textInput.value.trim();
            if (!rawText) {
                showToast('⚠️ กรุณาใส่ข้อความก่อน');
                textInput.focus();
                return;
            }

            const textToSpeak = cleanTextForSpeech(rawText);
            
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'th-TH'; // ภาษาไทย
            utterance.rate = parseFloat(speedRate.value); // ความเร็ว
            
            // เปลี่ยน UI เป็นสถานะกำลังอ่าน
            utterance.onstart = () => {
                isSpeaking = true;
                playBtn.innerHTML = '⏹️ หยุดอ่าน';
                playBtn.classList.add('playing');
            };

            // เมื่ออ่านจบ กลับสู่ปกติ
            utterance.onend = () => {
                resetUI();
            };

            // กรณีเกิดข้อผิดพลาด
            utterance.onerror = (e) => {
                console.error("Speech error:", e);
                resetUI();
            };

            synth.speak(utterance);
        }

        function stopSpeech() {
            synth.cancel();
            resetUI();
        }

        function resetUI() {
            isSpeaking = false;
            playBtn.innerHTML = '▶️ อ่านออกเสียง';
            playBtn.classList.remove('playing');
        }

        // ระบบแจ้งเตือน (Toast)
        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ป้องกันเสียงค้างตอนปิดหน้าเว็บ
        window.addEventListener('beforeunload', () => {
            if (synth.speaking) synth.cancel();
        });
    </script>
</body>
</html>
